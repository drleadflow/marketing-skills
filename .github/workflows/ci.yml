name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests
        run: npm test

      - name: Validate skills
        run: npm run validate

      - name: Build index and check for drift
        run: |
          npm run build
          git diff --exit-code -- README.md VERSIONS.md .claude-plugin .codex-plugin || \
            (echo "build-index.mjs produced a diff. Run 'npm run build' and commit the result." && exit 1)
